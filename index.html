<section class="sec" id="stories" style="padding-top:0"><div class="sh"><div><p class="lbl">Featured stories</p><h2 class="h2" style="margin-top:16px">A collection of<br><em>moments</em></h2></div><p style="color:var(--mut);max-width:320px">Moments, people and celebrations.</p></div>
<div class="sg">${CFG.stories.map((s,i)=>`<a class="st rv" href="#work" data-f="${s.cat}">${ph(s.src,"story"+i,s.title+" photography by SVK Studios")}<div class="cap"><span>${s.title}</span>${arrow}</div></a>`).join("")}</div>
<p style="margin-top:64px"><a class="btn s" href="#work">Explore all stories ${arrow}</a></p></section>

<section class="ft ov"><div class="ph" id="par"><img src="${CFG.img.feature||art("feature")}" alt="Wedding ceremony" loading="lazy"></div><div class="ov" style="position:absolute;inset:0"></div>
<div class="in2 rv"><h2 class="h">Your day.<br>Your people.<br><em>Your story.</em></h2><p style="max-width:340px;margin:28px 0;opacity:.85">From the quiet moments before the ceremony to the celebration that follows.</p><a class="btn" href="#work" data-f="Wedding">Wedding stories ${arrow}</a></div></section>

<section class="sec" id="services"><p class="lbl">Services</p><h2 class="h2" style="margin:16px 0 56px">What we create</h2>
<div class="sv"><div>${CFG.services.map((s,i)=>`<div class="row rv" tabindex="0" data-i="${i}"><span class="n">0${i+1}</span><div><b>${s[0]}</b><p>${s[1]}</p></div><span class="arr">→</span></div>`).join("")}</div>
<div class="sp" aria-hidden="true">${CFG.services.map((s,i)=>ph(CFG.img.preview[i],"svc"+i,"","","").replace('class="ph ','class="ph '+(i?'':'on ')+'')).join("")}</div></div></section>

<section class="sec dk" id="films"><p class="lbl">Cinematic films</p><h2 class="h2" style="margin-top:16px">Your story,<br><em>in motion.</em></h2>
<button class="fl ph" id="play" aria-label="Play film (video coming soon)"><img src="${CFG.img.film||art("film")}" alt="Wedding film still" loading="lazy"><span class="pl"></span><span class="t">PLAY FILM</span></button><p id="fm" style="margin-top:14px;font-size:13px;color:#a39a8c;min-height:24px"></p></section>

<section class="sec" id="work"><p class="lbl">Portfolio</p><h2 class="h2" style="margin-top:16px">The work</h2>
<div class="fs" role="tablist" aria-label="Filter portfolio">${["All","Wedding","Pre-Wedding","Portraits","Baby","Fashion","Events"].map((f,i)=>`<button data-f="${f}" class="${i?'':'on'}">${f.toUpperCase()}</button>`).join("")}</div><div class="mg" id="mg"></div></section>

<section class="sec" id="about"><div class="ab"><div class="rv">${ph(CFG.img.about,"about","Photographer at work")}</div><div class="rv"><p class="lbl">About</p><h2 class="h2" style="margin:16px 0 28px">Behind<br>the frame</h2><p style="color:var(--mut);max-width:460px">Photography is about people — the feelings, the families and the stories that make each day their own. We approach every session with patience and attention, so the pictures feel like you.</p><div class="tags"><span>WEDDINGS</span><span>PORTRAITS</span><span>FILMS</span><span>CREATIVE STORIES</span></div></div></div></section>

<section class="sec dk"><p class="lbl">The experience</p><h2 class="h2" style="margin-top:16px">How it works</h2><div class="pr">${CFG.steps.map((s,i)=>`<div class="rv"><b>0${i+1}</b><h3>${s[0].toUpperCase()}</h3><p>${s[1]}</p></div>`).join("")}</div></section>

<section class="sec"><p class="lbl">Testimonials</p><h2 class="h2" style="margin-top:16px">Words from the people<br>we've photographed</h2><div class="tm">${CFG.testimonials.map(t=>`<blockquote class="rv">“${t.q}”<cite>${t.n}</cite></blockquote>`).join("")}</div></section>

<section class="sec" id="contact" style="border-top:1px solid var(--ln)"><div class="ct"><div><p class="lbl">Location</p><h2 class="h2" style="margin:16px 0">Come say<br>hello.</h2>
<address><b style="font-weight:500;letter-spacing:.2em">SVK STUDIOS</b><br>${CFG.addr.join("<br>")}<br><a href="${TEL}">${CFG.phone}</a></address>
<div class="bt"><a class="btn" href="${TEL}">Call</a>${wa("WhatsApp")}<a class="btn" href="${DIR}" target="_blank" rel="noopener">Directions</a></div>
<div class="map">${CFG.mapEmbed?`<iframe src="${CFG.mapEmbed}" title="Map" loading="lazy" style="width:100%;height:100%;border:0"></iframe>`:`<div>Map appears here once an embed URL is added.<br><a href="${DIR}" target="_blank" rel="noopener" style="color:var(--ac)">Open in Google Maps →</a></div>`}</div></div>
<form id="fm2"><div class="f"><p class="lbl">Inquire</p></div>
<div><label for="a">Name</label><input id="a" name="Name" required autocomplete="name"></div><div><label for="b">Phone</label><input id="b" name="Phone" type="tel" required autocomplete="tel"></div>
<div><label for="c">Email</label><input id="c" name="Email" type="email" autocomplete="email"></div><div><label for="d">Event type</label><select id="d" name="Event">${["Wedding","Pre-Wedding","Portrait","Baby","Fashion","Event","Other"].map(o=>`<option>${o}</option>`).join("")}</select></div>
<div><label for="e">Event date</label><input id="e" name="Date" type="date"></div><div><label for="f">Location</label><input id="f" name="Location"></div>
<div class="f"><label for="g">Message</label><textarea id="g" name="Message" rows="3"></textarea></div>
<div class="f"><button class="btn" type="submit">Send inquiry ${arrow}</button></div><p id="msg" role="status"></p></form></div></section>

<section class="cta"><div class="ph"><img src="${CFG.img.cta||art("cta")}" alt="Couple at sunset" loading="lazy"></div><div class="ov" style="position:absolute;inset:0"></div><div class="rv"><h2 class="h">Your moment<br>deserves to be<br><em>remembered.</em></h2><p style="margin:28px auto;max-width:420px;opacity:.85">Let's create something you'll want to look back on for years to come.</p><div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap"><a class="btn" href="#contact">Start your story ${arrow}</a>${wa("WhatsApp us")}</div></div></section>`;

$("#ft").className="dk";
$("#ft").innerHTML=`<div><b style="letter-spacing:.4em;color:#efe8dc;font-weight:500">SVK STUDIOS</b><p style="margin-top:10px">${CFG.tag}<br>${CFG.city}</p></div>
<div><h4>EXPLORE</h4>${CFG.nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join("")}</div><div><h4>CONTACT</h4><a href="${TEL}">${CFG.phone}</a><a href="${WA()}" target="_blank" rel="noopener">WhatsApp</a></div>
<div><h4>FOLLOW</h4>${CFG.social.map(s=>s[1]?`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`:`<span style="display:block;padding:3px 0;opacity:.5">${s[0]}</span>`).join("")}</div><p class="cr">© 2026 SVK Studios. All rights reserved.</p>`;
$("#nl").innerHTML=CFG.nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join("")+`<a href="#contact" style="color:var(--ac)">Inquire →</a>`;
$("#menu").innerHTML=CFG.nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join("")+`<a href="#contact" style="color:var(--ac)">Inquire</a>`;
$("#bar").innerHTML=`<a href="${WA()}" target="_blank" rel="noopener">WHATSAPP</a><a href="#contact">INQUIRE</a>`;

/* nav */
const nav=$("#nav"),menu=$("#menu"),bg=$("#bg");
addEventListener("scroll",()=>nav.classList.toggle("sc",scrollY>60),{passive:true});
const tog=o=>{menu.classList.toggle("o",o);bg.setAttribute("aria-expanded",o);menu.setAttribute("aria-hidden",!o);document.body.style.overflow=o?"hidden":""};
bg.onclick=()=>tog(!menu.classList.contains("o"));$$("#menu a").forEach(a=>a.onclick=()=>tog(false));
/* reveal */
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});$$(".rv").forEach(e=>io.observe(e));
/* parallax (light) */
const par=$("#par"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!rm)addEventListener("scroll",()=>{const b=par.parentElement.getBoundingClientRect();if(b.bottom>0&&b.top<innerHeight)par.style.transform=`translateY(${(b.top*-.12).toFixed(1)}px)`},{passive:true});
/* services hover */
const rows=$$(".row"),pv=$$(".sp .ph");
const setSv=i=>{rows.forEach((r,j)=>r.classList.toggle("on",i==j));pv.forEach((p,j)=>p.classList.toggle("on",i==j))};
rows.forEach(r=>{r.onmouseenter=r.onfocus=()=>setSv(+r.dataset.i)});
/* film */
$("#play").onclick=()=>$("#fm").textContent="Film player coming soon — add a video URL in CFG when available.";
/* portfolio + lightbox */
let cur="All",list=[],idx=0;const mg=$("#mg");
function draw(){list=CFG.portfolio.filter(p=>cur=="All"||p.cat==cur||(cur=="Events"&&p.cat=="Event"));
 mg.innerHTML=list.map((p,i)=>`<button data-i="${i}" aria-label="Open ${p.title}"><div class="ph" style="aspect-ratio:${p.r}">${pic(p.src,p.title+p.cat+p.r,p.cat+" photograph: "+p.title)}</div></button>`).join("")}
$$(".fs button").forEach(b=>b.onclick=()=>{$$(".fs button").forEach(x=>x.classList.toggle("on",x==b));cur=b.dataset.f;draw()});
$$("[data-f].st,.ft [data-f]").forEach(a=>a.addEventListener("click",()=>{const b=$(`.fs button[data-f="${a.dataset.f=="Event"?"Events":a.dataset.f}"]`)||$(".fs button");b.click()}));
draw();
const lb=$("#lb");
function show(i){idx=(i+list.length)%list.length;const p=list[idx];$(".im",lb).innerHTML=pic(p.src,p.title+p.cat+p.r,p.title);$("p",lb).textContent=p.cat+" — "+p.title}
function open(i){show(i);lb.classList.add("o");document.body.style.overflow="hidden";$(".x",lb).focus()}
function close(){lb.classList.remove("o");document.body.style.overflow=""}
mg.onclick=e=>{const b=e.target.closest("button");if(b)open(+b.dataset.i)};
$(".x",lb).onclick=close;$(".p",lb).onclick=()=>show(idx-1);$(".nx",lb).onclick=()=>show(idx+1);
lb.onclick=e=>{if(e.target==lb)close()};
addEventListener("keydown",e=>{if(e.key=="Escape"){close();tog(false)}if(lb.classList.contains("o")){if(e.key=="ArrowLeft")show(idx-1);if(e.key=="ArrowRight")show(idx+1)}});
let sx=0;lb.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});lb.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(idx+(d<0?1:-1))});
/* inquiry — INTEGRATION POINT: replace with fetch(endpoint,…) to a real backend/email service */
$("#fm2").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),t="Hi SVK Studios, I'd like to enquire about a photography session.\n"+[...d].filter(x=>x[1]).map(x=>x[0]+": "+x[1]).join("\n");
 $("#msg").innerHTML=`This demo form isn't connected to a server yet. <a href="${WA(t)}" target="_blank" rel="noopener" style="color:var(--ac)">Send these details on WhatsApp →</a>`};
</script></body></html>
